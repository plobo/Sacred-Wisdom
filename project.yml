name: SacredWisdom
options:
  bundleIdPrefix: com.sacredwisdom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  SacredWisdom:
    type: application
    platform: iOS
    sources:
      - path: SacredWisdom
        excludes:
          - "Tests/**"
          - "App/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sacredwisdom.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SacredWisdom/App/Info.plist
        # https URL of content/packages/manifest.json on your content host. Empty: downloads not configured.
        CONTENT_MANIFEST_URL: ""
        INFOPLIST_KEY_CFBundleDisplayName: Sacred Wisdom
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Sacred Wisdom uses the microphone only while you search by voice."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Your words are recognized on this device to fill in your search."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  SacredWisdomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SacredWisdom/Tests/UnitTests
      - path: SacredWisdom/Tests/IntegrationTests
      - path: SacredWisdom/Tests/PerformanceTests
    dependencies:
      - target: SacredWisdom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sacredwisdom.app.tests
  SacredWisdomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SacredWisdom/Tests/UITests
    dependencies:
      - target: SacredWisdom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sacredwisdom.app.uitests
        TEST_TARGET_NAME: SacredWisdom
schemes:
  SacredWisdom:
    build:
      targets:
        SacredWisdom: all
        SacredWisdomTests: [test]
        SacredWisdomUITests: [test]
    test:
      targets:
        - SacredWisdomTests
        - SacredWisdomUITests
